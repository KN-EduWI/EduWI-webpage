    <meta
      name="description"
      content="EduWI to bezpłatne kursy przygotowujące do matury rozszerzonej z informatyki i matematyki, tworzone przez studentów Wydziału Informatyki AGH."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f4f2ed" />
    <script>
      (() => {
        const cookieName = "eduwi-theme";
        const savedTheme = document.cookie
          .split("; ")
          .find((cookie) => cookie.startsWith(`${cookieName}=`))
          ?.split("=")[1];
        const hasSavedTheme = savedTheme === "light" || savedTheme === "dark";
        const theme =
          hasSavedTheme
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#111412" : "#f4f2ed");

        if (!hasSavedTheme) {
          const secure = location.protocol === "https:" ? "; Secure" : "";
          document.cookie = `${cookieName}=${theme}; Max-Age=31536000; Path=/; SameSite=Lax${secure}`;
        }
      })();
    </script>
